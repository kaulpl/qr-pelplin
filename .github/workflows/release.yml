name: Package WordPress plugin release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: |
          find qr-pelplin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -Fq "Version: ${TAG}" qr-pelplin/qr-pelplin.php
      - name: Build ZIP with correct plugin root
        run: zip -r qr-pelplin.zip qr-pelplin -x '*.DS_Store'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" qr-pelplin.zip --generate-notes --verify-tag
