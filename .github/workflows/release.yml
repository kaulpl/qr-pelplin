name: Package WordPress plugin release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Validate PHP
        run: find qr-pelplin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG#v}"
          grep -Fq "Version: ${TAG}" qr-pelplin/qr-pelplin.php
      - name: Build installable WordPress ZIP
        run: zip -r qr-pelplin.zip qr-pelplin -x '*.DS_Store'
      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" qr-pelplin.zip --clobber
          else
            gh release create "$RELEASE_TAG" qr-pelplin.zip --generate-notes --verify-tag
          fi
