name: Verify and publish WordPress plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qr-pelplin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm check && pnpm test
      - name: Test WordPress media routing and update controls
        env:
          QRP_TEST_PHP: ${{ matrix.php }}
        run: pnpm test:wordpress
      - name: Validate PHP with native interpreter
        run: find qr-pelplin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Package installable ZIP
        run: pnpm package
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: qr-pelplin-plugin
          path: release/qr-pelplin.zip
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qr-pelplin-plugin
          path: release
      - name: Publish new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/ \* Version: //p' qr-pelplin/qr-pelplin.php)
          test -n "$VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; published assets remain immutable."
          else
            gh release create "v$VERSION" release/qr-pelplin.zip --target "$GITHUB_SHA" --title "QR Pelplin $VERSION" --notes-file docs/RELEASE-NOTES.md
          fi
