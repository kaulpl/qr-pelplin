name: CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm run build
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l wordpress/plugins/qr-pelplin/qr-pelplin.php
